<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Message Sent — BSB Group Developers</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0f19;--card:#151c2c;--border:#232c42;--text:#e8ecf5;--muted:#9aa5bd;
--accent-grad:linear-gradient(135deg,#6366f1 0%,#22d3ee 100%)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);
  min-height:100vh;display:grid;place-items:center;padding:24px;line-height:1.65}
.box{background:var(--card);border:1px solid var(--border);border-radius:22px;
  padding:56px 40px;max-width:520px;text-align:center;box-shadow:0 30px 60px rgba(0,0,0,.5)}
.tick{width:76px;height:76px;margin:0 auto 26px;border-radius:50%;background:var(--accent-grad);
  display:grid;place-items:center;font-size:2.2rem}
h1{font-family:'Sora',sans-serif;font-size:1.9rem;margin-bottom:14px}
p{color:var(--muted);margin-bottom:28px}
.btn{display:inline-block;padding:14px 30px;border-radius:999px;font-weight:600;
  text-decoration:none;background:var(--accent-grad);color:#fff;
  box-shadow:0 8px 24px rgba(99,102,241,.35);transition:transform .2s}
.btn:hover{transform:translateY(-2px)}
.alt{margin-top:26px;font-size:.9rem;color:var(--muted)}
.alt a{color:#22d3ee;text-decoration:none}
</style>
</head>
<body>
  <div class="box">
    <div class="tick">✅</div>
    <h1>Message sent!</h1>
    <p>Thanks for reaching out. We've got your enquiry and will get back to you within one business day.</p>
    <a class="btn" href="/">← Back to site</a>
    <div class="alt">Need something urgently?<br>
      <a href="https://wa.me/919303008315" target="_blank" rel="noopener">WhatsApp +91 93030 08315</a> ·
      <a href="mailto:bsbgroupdevelopers@gmail.com">bsbgroupdevelopers@gmail.com</a>
    </div>
  </div>
</body>
</html>
